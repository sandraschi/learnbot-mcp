[project]
name = "learnbot-mcp"
version = "0.6.0"
description = "Language learning chatbot - persona management, safety, multi-platform output, robot control"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "aiosqlite",
    "httpx",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "starlette",
    "uvicorn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "SIM", "UP"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pywinauto>=0.6.9",
    "ruff>=0.15.22",
]
