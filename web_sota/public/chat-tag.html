<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miko-chan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:transparent;overflow:hidden;width:340px}

/* Tag (collapsed) */
#tag{display:flex;align-items:center;gap:8px;background:#1a2332;border:1px solid #2a3548;border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:all 0.2s;user-select:none;width:fit-content}
#tag:hover{border-color:#5b9fd4;box-shadow:0 4px 24px rgba(91,159,212,0.3)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0}
.tag-text{font-size:13px;color:#e8edf4;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}

/* Panel (expanded) */
#panel{display:none;flex-direction:column;height:460px;background:#0f1419;border:1px solid #2a3548;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
#panel.open{display:flex}
.panel-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1a2332;border-bottom:1px solid #2a3548}
.panel-header .avatar{width:24px;height:24px;font-size:11px}
.panel-header .title{flex:1;font-size:13px;font-weight:600;color:#e8edf4}
.panel-header button{background:none;border:none;color:#8b9cb3;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.panel-header button:hover{color:#e8edf4;background:#2a3548}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.4}
.msgs .m{max-width:85%;padding:6px 10px;border-radius:10px;animation:fadeIn 0.2s}
.msgs .user{background:#f59e0b20;border:1px solid #f59e0b30;align-self:flex-end;color:#e8edf4}
.msgs .assistant{background:#1a2332;border:1px solid #2a3548;align-self:flex-start;color:#cbd5e1}
.msgs .system{background:transparent;color:#64748b;font-size:11px;text-align:center;padding:4px}
.input-row{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #2a3548;background:#0f1419}
.input-row input{flex:1;background:#1a2332;border:1px solid #2a3548;border-radius:8px;padding:7px 10px;font-size:13px;color:#e8edf4;outline:none}
.input-row input:focus{border-color:#5b9fd4}
.input-row button{background:#5b9fd4;border:none;border-radius:8px;padding:7px 10px;color:#fff;cursor:pointer;font-size:13px;font-weight:500}
.input-row button:hover{background:#4a8fc4}
.input-row button:disabled{opacity:0.4}
.actions{display:flex;gap:4px;padding:6px 10px;border-top:1px solid #2a3548}
.actions button{flex:1;background:#1a2332;border:1px solid #2a3548;border-radius:8px;padding:5px;color:#8b9cb3;cursor:pointer;font-size:11px}
.actions button:hover{color:#e8edf4;border-color:#5b9fd4}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.thinking{color:#64748b;font-size:11px;padding:4px 10px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:0.4}}
</style>
</head>
<body>
<div id="tag" onclick="toggle()">
  <div class="avatar">M</div>
  <div class="dot"></div>
  <span class="tag-text">Miko-chan</span>
  <span style="font-size:10px;color:#8b9cb3">&#x25B2;</span>
</div>

<div id="panel">
  <div class="panel-header">
    <div class="avatar">M</div>
    <div class="title">Miko-chan</div>
    <button onclick="minimize()" title="Minimize">&#x2014;</button>
  </div>
  <div class="msgs" id="msgs">
    <div class="m system">Click a persona below or type to start</div>
  </div>
  <div class="actions" id="personas"></div>
  <div class="input-row">
    <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "http://127.0.0.1:11101";
let convId = null;
let persona = "miko";
let loading = false;

async function toggle() {
  const p = document.getElementById("panel");
  const t = document.getElementById("tag");
  if (p.classList.contains("open")) {
    p.classList.remove("open");
    t.style.display = "flex";
  } else {
    p.classList.add("open");
    t.style.display = "none";
    await loadPersonas();
    await startConv();
  }
}

function minimize() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("tag").style.display = "flex";
}

async function loadPersonas() {
  try {
    const r = await fetch(API + "/api/personas");
    const data = await r.json();
    const div = document.getElementById("personas");
    div.innerHTML = "";
    (data.personas || []).forEach((p) => {
      const btn = document.createElement("button");
      btn.textContent = p.display_name || p.name;
      btn.onclick = () => selectPersona(p.name);
      div.appendChild(btn);
    });
  } catch {}
}

async function selectPersona(name) {
  persona = name;
  convId = null;
  addMsg("system", "Switched to " + name);
  await startConv();
}

async function startConv() {
  try {
    const r = await fetch(API + "/api/conversations", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({persona, platform: "web", user_id: "chat-tag"}),
    });
    const data = await r.json();
    convId = data.conversation_id;
    addMsg("system", "Chatting with " + persona);
  } catch (e) {
    addMsg("system", "Error: " + e.message);
  }
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || loading || !convId) return;
  input.value = "";
  addMsg("user", text);
  loading = true;
  document.getElementById("sendBtn").disabled = true;
  const think = addMsg("system", "Thinking...");
  try {
    const r = await fetch(API + "/api/conversations/" + convId + "/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: text, user_id: "chat-tag"}),
    });
    const data = await r.json();
    think.remove();
    if (data.response) addMsg("assistant", data.response);
    if (data.safety_verdict === "blocked") addMsg("system", "Blocked by safety rules");
  } catch (e) {
    think.remove();
    addMsg("system", "Error: " + e.message);
  }
  loading = false;
  document.getElementById("sendBtn").disabled = false;
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "m " + role;
  div.textContent = text;
  document.getElementById("msgs").appendChild(div);
  div.scrollIntoView({behavior: "smooth"});
  return div;
}
</script>
</body>
</html>
